# Link checker configuration for docs/
# Validates fully-qualified http(s) URLs found in docs/. Relative links are not checked
# (no base_url is set, and non-http(s) links are excluded via workflow args).

verbose = "info"
no_progress = true

# Do not extract links from fenced code blocks or inline code.
include_verbatim = false

scheme = ["https", "http"]

accept = ["200", "204", "302", "403", "429"]

max_redirects = 20
timeout = 20

# Skip localhost URLs (see also --exclude-loopback in the workflow).
exclude_loopback = true

# Skip relative markdown links.
exclude = [
  '^/',
  '^\\./',
  '^\\.\\./',
  '^mailto:',
  # GCP Console deep links need a browser. Lychee in CI gets HTTP/2 protocol errors from this host.
  # Single-quoted TOML is literal, so this is one backslash per dot. Two backslashes never match.
  '^https://console\.cloud\.google\.com/',
]
