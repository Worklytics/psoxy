# Example (alpha): PR category + AI attribution from title, body, and squash commit_message.
# Not enabled in prebuilt GitHub connector rules; exercised by RegexExtractAiAttributionAugmentTest.
!<regexExtract>
jsonPaths:
  - "$[*]"
sourceFields:
  - "title"
  - "body"
  - "commit_message"
extractions:
  prCategory:
    - regex: "(?i)^(?:fix|bugfix|hotfix|patch)(?:\\(|:|\\s)"
      value: "Bugfix"
    - regex: "(?i)^(?:feat|feature)(?:\\(|:|\\s)"
      value: "Feature"
    - regex: "(?i)^(?:docs?)(?:\\(|:|\\s)"
      value: "Docs"
    - regex: "(?i)^(?:chore|refactor|test|ci|build|style|perf)(?:\\(|:|\\s)"
      value: "Other"
  aiAssistPlatform:
    - regex: "(?i)Made with Cursor"
      value: "Cursor"
    - regex: "(?i)Co-Authored-By:\\s*Cursor"
      value: "Cursor"
    - regex: "(?i)cursoragent@cursor\\.com"
      value: "Cursor"
    - regex: "(?i)Co-Authored-By:\\s*Claude"
      value: "Claude Code"
    - regex: "(?i)Generated with Claude Code"
      value: "Claude Code"
    - regex: "(?i)noreply@anthropic\\.com"
      value: "Claude Code"
    - regex: "(?i)Copilot coding-agent"
      value: "Copilot"
    - regex: "(?i)copilot-swe-agent"
      value: "Copilot"
    - regex: "(?i)Co-Authored-By:\\s*(?:GitHub )?Copilot"
      value: "Copilot"
    - regex: "(?i)Co-Authored-By:\\s*[^\\n<]+<[^>]*(?:bot|ai)[^>]*>"
      value: "Other AI"
  aiAssistModel:
    - regex: "(?i)model:\\s*([\\w./+-]+)"
      group: 1
    - regex: "(?i)Claude\\s+([\\w./+-]+)"
      group: 1
