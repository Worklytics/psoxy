name: 'validate tf'

# run everywhere; should be internally consistent

on:
  push:
    branches:
      - '**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate_tf_example_dev:
    strategy:
      matrix:
        example_path: [
                        'examples-dev/aws',
                        'examples-dev/gcp',
        ]
        # Keep in sync with ci-terraform-modules.yaml and ci-terraform-examples-release.yaml
        # TODO(v0.8): drop ~1.7.0 through ~1.10.0 when min TF is ~> 1.11
        terraform_version: [
          '~1.7.0', '~1.8.0', '~1.9.0', '~1.10.0', '~1.11.0', '~1.12.0', '~1.13.0',
          '~1.14.0', '~1.15.0', '~1.16.0', '~1.17.0', 'latest' ]
    uses: ./.github/workflows/ci-terraform-example.yaml
    with:
      terraform_version: ${{ matrix.terraform_version }}
      example_path: ${{ matrix.example_path }}
