name: CI - Tools

on:
  push:
    branches:
      - '**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Node version matrix notes (see https://github.com/nodejs/release#release-schedule):
# even numbers become LTS; odd are short-lived "current" releases
# 18, 20, 25 are EOL (20 since Apr 2026) - no longer receive security fixes
# 22 maintenance LTS; EOL Apr 2027
# 24 LTS; EOL Apr 2028
# 26 released Apr 2026; becomes LTS Oct 2026 - covered by "latest"

jobs:
  ci_tools:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22", "24", "latest"]
    steps:
    - uses: actions/checkout@v5
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: ./tools/psoxy-test
    - name: Install dependencies
      working-directory: ./tools/psoxy-test
      run: npm i
    - name: Run tests
      working-directory: ./tools/psoxy-test
      run: npm test

  ci_schema_tool:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22", "24", "latest"]
    steps:
    - uses: actions/checkout@v5
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: ./tools/schema-tool
    - name: Install dependencies
      working-directory: ./tools/schema-tool
      run: npm i
    - name: Run tests
      working-directory: ./tools/schema-tool
      run: npm test

  ci_generate_todos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test generate-todos.sh
        run: ./tools/generate-todos.test.sh

  ci_gcp_iam_permission_script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test GCP IAM permission check fixtures
        run: ./tools/gcp/check-gcp-iam-permissions.test.sh
