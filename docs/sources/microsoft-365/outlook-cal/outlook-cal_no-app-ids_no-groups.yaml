        type: "string"
      bias:
        type: "integer"
      daylightOffset:
        $ref: "#/definitions/Offset"
      name:
        type: "string"
      standardOffset:
        $ref: "#/definitions/Offset"
  DateTimeTimeZone:
    type: "object"
    properties:
      dateTime:
        type: "string"
        format: "date-time"
      timeZone:
        type: "string"
      timeZoneIANA:
        type: "string"
  EmailAddress:
    type: "object"
    properties:
      address:
        type: "string"
  Event:
    type: "object"
    properties:
      '@odata.etag':
        type: "string"
      attachments:
        type: "array"
        items:
