      originalEndTimeZone:
        type: "string"
      originalStartTimeZone:
        type: "string"
      recurrence:
        $ref: "#/definitions/PatternedRecurrence"
      responseRequested:
        type: "boolean"
      responseStatus:
        $ref: "#/definitions/ResponseStatus"
      sensitivity:
        type: "string"
      seriesMasterId:
        type: "string"
      showAs:
        type: "string"
      start:
        $ref: "#/definitions/DateTimeTimeZone"
      subject:
        type: "string"
      type:
        type: "string"
      uid:
        type: "string"
      webLink:
        type: "string"
      workItemId:
        type: "string"
  GraphUser:
    type: "object"
    properties:
      accountEnabled:
        type: "boolean"
      employeeId:
        type: "string"
      hireDate:
        type: "string"
        format: "date-time"
      id:
        type: "string"
      isResourceAccount:
        type: "boolean"
      mail:
