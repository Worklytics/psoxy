  Recipient:
    type: "object"
    properties:
      emailAddress:
        $ref: "#/definitions/EmailAddress"
  RecurrencePattern:
    type: "object"
    properties:
      dayOfMonth:
        type: "integer"
      daysOfWeek:
        type: "array"
        items:
