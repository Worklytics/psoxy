      hasAttachments:
        type: "boolean"
      hideAttendees:
        type: "boolean"
      iCalUId:
        type: "string"
      id:
        type: "string"
      importance:
        type: "string"
      isAllDay:
        type: "boolean"
      isCancelled:
        type: "boolean"
      isDraft:
        type: "boolean"
      isOnlineMeeting:
