          - "team building"
          - "teambuilding"
          - "daily"
          - "bi-weekly"
          - "biweekly"
          - "weekly"
          - "monthly"
          - "quarterly"
          - "1:1"
          - "1-on-1"
          - "one-on-one"
          - "all-hands"
          - "all hands"
          - "allhands"
          - "team meeting"
          - "decision making"
          - "decision"
          - "hand off"
          - "hand-off"
          - "handoff"
          - "handover"
          - "information sharing"
          - "problem solving"
          - "retro"
          - "review"
          - "sprint"
    responseSchema:
      type: "object"
      properties:
        '@odata.etag':
          type: "string"
        attachments:
          type: "array"
          items:
            $ref: "#/definitions/Attachment"
        attendees:
          type: "array"
          items:
            $ref: "#/definitions/Attendee"
        body:
