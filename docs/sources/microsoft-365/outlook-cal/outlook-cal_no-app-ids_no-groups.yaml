---
endpoints:
  - pathRegex: "^/v1.0/users(/p~[a-zA-Z0-9_-]+?)?[^/]*/(((calendars/[^/]*/)?events(\\\
    ?.*)?)|(calendar/calendarView(?)[^/]*))"
    transforms:
      - !<pseudonymize>
        jsonPaths:
          - "$..emailAddress.address"
        encoding: "URL_SAFE_TOKEN"
      - !<tokenize>
        jsonPaths:
          - "$.['@odata.nextLink', '@odata.prevLink', 'sessions@odata.nextLink']"
        regex: "^https://graph.microsoft.com/v1.0/users/([a-zA-Z0-9_-]+)/.*$"
      - !<redact>
        jsonPaths:
          - "$..['@odata.context']"
      - !<redact>
        jsonPaths:
          - "$..['calendar@odata.associationLink', 'calendar@odata.navigationLink']"
      - !<filterTokenByRegex>
        jsonPaths:
          - "$..body.content"
          - "$..bodyPreview"
        delimiter: "\\s+"
        filters:
          - "https://[^.]+\\.zoom\\.us/.*"
      - !<redactRegexMatches>
        jsonPaths:
          - "$..location.uniqueId"
          - "$..locations[*].uniqueId"
          - "$..location.displayName"
          - "$..locations[*].displayName"
          - "$..location.locationUri"
          - "$..locations[*].locationUri"
          - "$..onlineMeeting.joinUrl"
          - "$..onlineMeetingUrl"
          - "$..body.content"
          - "$..bodyPreview"
        redactions:
          - "(?i)pwd=[^&]*"
      - !<redactExceptPhrases>
        jsonPaths:
          - "$..subject"
        allowedPhrases:
          - "Focus Time"
          - "Focus"
          - "No Meetings"
          - "No Meeting"
          - "no mtg"
          - "Prep"
          - "OOO"
          - "Out of Office"
          - "Out of the Office"
          - "call"
          - "brainstorm"
          - "brainstorming"
          - "brain storm"
          - "check in"
          - "check-in"
          - "checkin"
          - "coffee"
          - "food"
          - "happy hour"
          - "lunch"
          - "office hours"
          - "onsite"
          - "on-site"
          - "social"
          - "stand up"
          - "stand-up"
          - "standup"
          - "team building"
          - "teambuilding"
          - "daily"
          - "bi-weekly"
          - "biweekly"
          - "weekly"
          - "monthly"
          - "quarterly"
          - "1:1"
          - "1-on-1"
          - "one-on-one"
          - "all-hands"
          - "all hands"
          - "allhands"
          - "team meeting"
          - "decision making"
          - "decision"
          - "hand off"
          - "hand-off"
          - "handoff"
          - "handover"
          - "information sharing"
          - "problem solving"
          - "retro"
          - "review"
          - "sprint"
    responseSchema:
      type: "object"
      properties:
        '@microsoft.graph.hasMoreData':
          type: "boolean"
        '@odata.context':
          type: "string"
        '@odata.deltaLink':
          type: "string"
        '@odata.nextLink':
          type: "string"
        value:
          type: "array"
          items:
            $ref: "#/definitions/Event"
