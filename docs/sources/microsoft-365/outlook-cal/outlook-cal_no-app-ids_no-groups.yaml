      month:
        type: "integer"
      type:
        type: "string"
  RecurrenceRange:
    type: "object"
    properties:
      endDate:
        type: "string"
      numberOfOccurrences:
        type: "integer"
      recurrenceTimeZone:
        type: "string"
      startDate:
        type: "string"
      type:
        type: "string"
  ResponseStatus:
    type: "object"
    properties:
      response:
        type: "string"
      time:
        type: "string"
        format: "date-time"
  WorkingHours:
    type: "object"
    properties:
      daysOfWeek:
        type: "array"
        items:
          type: "string"
      endTime:
        type: "string"
        format: "time"
      startTime:
        type: "string"
        format: "time"
      timeZone:
        anyOf:
          - $ref: "#/definitions/CustomTimeZone"
