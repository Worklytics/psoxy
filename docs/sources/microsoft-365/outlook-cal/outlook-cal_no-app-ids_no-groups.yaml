  - pathRegex: "^/v1.0/users(/p~[a-zA-Z0-9_-]+?)?[^/]*/mailboxSettings(\\?.*)?$"
    transforms:
      - !<redact>
        jsonPaths:
          - "$..['@odata.context']"
    responseSchema:
      type: "object"
      properties:
        '@odata.context':
          type: "string"
        archiveFolder:
          type: "string"
        automaticRepliesSetting:
          $ref: "#/definitions/AutomaticRepliesSettings"
        dateFormat:
          type: "string"
        delegateMeetingMessageDeliveryOptions:
          type: "string"
        language:
          $ref: "#/definitions/LocaleInfo"
        timeFormat:
          type: "string"
        timeZone:
          type: "string"
        userPurpose:
          type: "string"
        workingHours:
          $ref: "#/definitions/WorkingHours"
  - pathRegex: "^/v1.0/users(\\?.*)?$"
    allowedQueryParams:
      - "$top"
      - "$select"
      - "$skiptoken"
      - "$orderBy"
      - "$count"
      - "$filter"
    allowedRequestHeaders:
      - "ConsistencyLevel"
    transforms:
      - !<pseudonymize>
        jsonPaths:
          - "$..employeeId"
          - "$..userPrincipalName"
          - "$..imAddresses[*]"
          - "$..mail"
          - "$..otherMails[*]"
          - "$..onPremisesSamAccountName"
          - "$..onPremisesUserPrincipalName"
          - "$..onPremisesDistinguishedName"
          - "$..onPremisesImmutableId"
          - "$..identities[*].issuerAssignedId"
        encoding: "URL_SAFE_TOKEN"
      - !<pseudonymize>
        jsonPaths:
          - "$..id"
        includeReversible: true
        encoding: "URL_SAFE_TOKEN"
      - !<pseudonymizeRegexMatches>
        jsonPaths:
          - "$..proxyAddresses[*]"
        regex: "(?i)^smtp:(.*)$"
    responseSchema:
      type: "object"
      properties:
        '@microsoft.graph.hasMoreData':
          type: "boolean"
        '@odata.deltaLink':
          type: "string"
        '@odata.nextLink':
          type: "string"
        value:
          type: "array"
          items:
            $ref: "#/definitions/GraphUser"
  - pathRegex: "^/v1.0/users/p~[a-zA-Z0-9_-]+(\\?.*)?$"
    allowedQueryParams:
      - "$select"
    allowedRequestHeaders:
      - "ConsistencyLevel"
    transforms:
      - !<pseudonymize>
        jsonPaths:
          - "$..employeeId"
          - "$..userPrincipalName"
          - "$..imAddresses[*]"
          - "$..mail"
          - "$..otherMails[*]"
          - "$..onPremisesSamAccountName"
          - "$..onPremisesUserPrincipalName"
          - "$..onPremisesDistinguishedName"
          - "$..onPremisesImmutableId"
          - "$..identities[*].issuerAssignedId"
        encoding: "URL_SAFE_TOKEN"
      - !<pseudonymize>
        jsonPaths:
          - "$..id"
        includeReversible: true
        encoding: "URL_SAFE_TOKEN"
      - !<pseudonymizeRegexMatches>
        jsonPaths:
          - "$..proxyAddresses[*]"
        regex: "(?i)^smtp:(.*)$"
    responseSchema:
      type: "object"
      properties:
        accountEnabled:
          type: "boolean"
        employeeId:
          type: "string"
        hireDate:
          type: "string"
          format: "date-time"
        id:
          type: "string"
        isResourceAccount:
          type: "boolean"
        mail:
          type: "string"
        mailboxSettings:
          $ref: "#/definitions/MailboxSettings"
        otherMails:
          type: "array"
          items:
            type: "string"
        proxyAddresses:
          type: "array"
          items:
            type: "string"
        userType:
          type: "string"
definitions:
  Attachment:
    type: "object"
    properties:
      size:
        type: "integer"
  Attendee:
