---
endpoints:
- pathRegex: "^/v1.0/groups/?(\\?.*)?$"
  allowedRequestHeaders:
  - "ConsistencyLevel"
  transforms:
  - !<pseudonymize>
    jsonPaths:
    - "$..mail"
    includeOriginal: true
    encoding: "JSON"
  - !<pseudonymizeRegexMatches>
    jsonPaths:
    - "$..proxyAddresses[*]"
    regex: "(?i)^smtp:(.*)$"
  responseSchema:
    type: "object"
    properties:
      '@microsoft.graph.hasMoreData':
        type: "boolean"
      '@odata.deltaLink':
        type: "string"
      '@odata.nextLink':
        type: "string"
      value:
        type: "array"
        items:
          $ref: "#/definitions/GraphGroup"
- pathRegex: "^/v1.0/groups/[^/?]+(\\?.*)?$"
  allowedRequestHeaders:
  - "ConsistencyLevel"
  transforms:
  - !<pseudonymize>
    jsonPaths:
    - "$..mail"
    includeOriginal: true
    encoding: "JSON"
  - !<pseudonymizeRegexMatches>
    jsonPaths:
    - "$..proxyAddresses[*]"
    regex: "(?i)^smtp:(.*)$"
  responseSchema:
    type: "object"
    properties:
      id:
        type: "string"
      mail:
        type: "string"
- pathRegex: "^/v1.0/groups/[^/]*/members.*"
  allowedQueryParams:
  - "$top"
  - "$select"
  - "$skiptoken"
  - "$orderBy"
  - "$count"
  allowedRequestHeaders:
  - "ConsistencyLevel"
  transforms:
  - !<pseudonymize>
    jsonPaths:
    - "$..employeeId"
    - "$..userPrincipalName"
    - "$..imAddresses[*]"
    - "$..mail"
    - "$..otherMails[*]"
    - "$..onPremisesSamAccountName"
    - "$..onPremisesUserPrincipalName"
    - "$..onPremisesDistinguishedName"
    - "$..onPremisesImmutableId"
    - "$..identities[*].issuerAssignedId"
    encoding: "URL_SAFE_TOKEN"
  - !<pseudonymize>
    jsonPaths:
    - "$..id"
    encoding: "URL_SAFE_TOKEN"
  - !<pseudonymizeRegexMatches>
    jsonPaths:
    - "$..proxyAddresses[*]"
    regex: "(?i)^smtp:(.*)$"
  responseSchema:
    type: "object"
    properties:
      '@microsoft.graph.hasMoreData':
        type: "boolean"
      '@odata.deltaLink':
        type: "string"
      '@odata.nextLink':
        type: "string"
      value:
        type: "array"
        items:
          $ref: "#/definitions/GraphGroupMember"
- pathRegex: "^/v1.0/users(\\?.*)?$"
  allowedQueryParams:
  - "$top"
  - "$select"
  - "$skiptoken"
  - "$orderBy"
  - "$count"
  - "$filter"
  allowedRequestHeaders:
  - "ConsistencyLevel"
  transforms:
  - !<pseudonymize>
    jsonPaths:
    - "$..employeeId"
    - "$..userPrincipalName"
    - "$..imAddresses[*]"
    - "$..mail"
    - "$..otherMails[*]"
    - "$..onPremisesSamAccountName"
    - "$..onPremisesUserPrincipalName"
    - "$..onPremisesDistinguishedName"
    - "$..onPremisesImmutableId"
    - "$..identities[*].issuerAssignedId"
    encoding: "URL_SAFE_TOKEN"
  - !<pseudonymize>
    jsonPaths:
    - "$..id"
    includeReversible: true
    encoding: "URL_SAFE_TOKEN"
  - !<pseudonymizeRegexMatches>
    jsonPaths:
    - "$..proxyAddresses[*]"
    regex: "(?i)^smtp:(.*)$"
  responseSchema:
    type: "object"
    properties:
      '@microsoft.graph.hasMoreData':
        type: "boolean"
      '@odata.deltaLink':
        type: "string"
      '@odata.nextLink':
        type: "string"
      value:
        type: "array"
        items:
          $ref: "#/definitions/GraphUser"
- pathRegex: "^/v1.0/users/p~[a-zA-Z0-9_-]+(\\?.*)?$"
  allowedQueryParams:
  - "$select"
  allowedRequestHeaders:
  - "ConsistencyLevel"
  transforms:
  - !<pseudonymize>
    jsonPaths:
    - "$..employeeId"
    - "$..userPrincipalName"
    - "$..imAddresses[*]"
    - "$..mail"
    - "$..otherMails[*]"
    - "$..onPremisesSamAccountName"
    - "$..onPremisesUserPrincipalName"
    - "$..onPremisesDistinguishedName"
    - "$..onPremisesImmutableId"
    - "$..identities[*].issuerAssignedId"
    encoding: "URL_SAFE_TOKEN"
  - !<pseudonymize>
    jsonPaths:
    - "$..id"
    includeReversible: true
    encoding: "URL_SAFE_TOKEN"
  - !<pseudonymizeRegexMatches>
    jsonPaths:
    - "$..proxyAddresses[*]"
    regex: "(?i)^smtp:(.*)$"
  responseSchema:
    type: "object"
    properties:
      accountEnabled:
        type: "boolean"
      employeeId:
        type: "string"
      hireDate:
        type: "string"
        format: "date-time"
      id:
        type: "string"
      isResourceAccount:
        type: "boolean"
      mail:
        type: "string"
      mailboxSettings:
        $ref: "#/definitions/MailboxSettings"
      otherMails:
        type: "array"
        items:
          type: "string"
      proxyAddresses:
        type: "array"
        items:
          type: "string"
      userType:
        type: "string"
definitions:
  AutomaticRepliesSettings:
    type: "object"
    properties:
      externalAudience:
        type: "string"
      scheduledEndDateTime:
        $ref: "#/definitions/DateTimeTimeZone"
      scheduledStartDateTime:
        $ref: "#/definitions/DateTimeTimeZone"
      status:
        type: "string"
  CustomTimeZone:
    type: "object"
    properties:
      '@odata.type':
        type: "string"
      bias:
        type: "integer"
      daylightOffset:
        $ref: "#/definitions/Offset"
      name:
        type: "string"
      standardOffset:
        $ref: "#/definitions/Offset"
  DateTimeTimeZone:
    type: "object"
    properties:
      dateTime:
        type: "string"
        format: "date-time"
      timeZone:
        type: "string"
      timeZoneIANA:
        type: "string"
  GraphGroup:
    type: "object"
    properties:
      id:
        type: "string"
      mail:
        type: "string"
  GraphGroupMember:
    type: "object"
    properties:
      id:
        type: "string"
  GraphUser:
    type: "object"
    properties:
      accountEnabled:
        type: "boolean"
      employeeId:
        type: "string"
      hireDate:
        type: "string"
        format: "date-time"
      id:
        type: "string"
      isResourceAccount:
        type: "boolean"
      mail:
        type: "string"
      mailboxSettings:
        $ref: "#/definitions/MailboxSettings"
      otherMails:
        type: "array"
        items:
          type: "string"
      proxyAddresses:
        type: "array"
        items:
          type: "string"
      userType:
        type: "string"
  LocaleInfo:
    type: "object"
    properties:
      displayName:
        type: "string"
      locale:
        type: "string"
  MailboxSettings:
    type: "object"
    properties:
      archiveFolder:
        type: "string"
      automaticRepliesSetting:
        $ref: "#/definitions/AutomaticRepliesSettings"
      dateFormat:
        type: "string"
      delegateMeetingMessageDeliveryOptions:
        type: "string"
      language:
        $ref: "#/definitions/LocaleInfo"
      timeFormat:
        type: "string"
      timeZone:
        type: "string"
      userPurpose:
        type: "string"
      workingHours:
        $ref: "#/definitions/WorkingHours"
  Offset:
    type: "object"
    properties:
      dayOccurrence:
        type: "integer"
      dayOfWeek:
        type: "string"
      daylightBias:
        type: "integer"
      month:
        type: "integer"
      time:
        type: "string"
      year:
        type: "integer"
  WorkingHours:
    type: "object"
    properties:
      daysOfWeek:
        type: "array"
        items:
          type: "string"
      endTime:
        type: "string"
        format: "time"
      startTime:
        type: "string"
        format: "time"
      timeZone:
        anyOf:
        - $ref: "#/definitions/CustomTimeZone"
