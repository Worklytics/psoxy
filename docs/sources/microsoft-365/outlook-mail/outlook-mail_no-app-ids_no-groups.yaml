---
endpoints:
- pathRegex: "^/v1.0/users(/p~[a-zA-Z0-9_-]+?)?[^/]*"
  allowedQueryParams:
  - "$top"
  - "$select"
  - "$skiptoken"
  - "$orderBy"
  - "$count"
  - "$filter"
  allowedRequestHeaders:
  - "ConsistencyLevel"
  transforms:
  - !<pseudonymize>
    jsonPaths:
    - "$..employeeId"
    - "$..userPrincipalName"
    - "$..imAddresses[*]"
    - "$..mail"
    - "$..otherMails[*]"
    - "$..onPremisesSamAccountName"
    - "$..onPremisesUserPrincipalName"
    - "$..onPremisesDistinguishedName"
    - "$..onPremisesImmutableId"
    - "$..identities[*].issuerAssignedId"
    encoding: "URL_SAFE_TOKEN"
  - !<pseudonymize>
    jsonPaths:
    - "$..id"
    includeReversible: true
    encoding: "URL_SAFE_TOKEN"
  - !<pseudonymizeRegexMatches>
    jsonPaths:
    - "$..proxyAddresses[*]"
    regex: "(?i)^smtp:(.*)$"
  responseSchema:
    type: "object"
    properties:
      '@microsoft.graph.hasMoreData':
        type: "boolean"
      '@odata.deltaLink':
        type: "string"
      '@odata.nextLink':
        type: "string"
      value:
        type: "array"
        items:
          $ref: "#/definitions/GraphUser"
- pathRegex: "^/v1.0/users(/p~[a-zA-Z0-9_-]+?)?[^/]*/mailFolders(/SentItems|\\('SentItems'\\\
    ))/messages.*"
  allowedRequestHeaders:
  - "ConsistencyLevel"
  augments:
  - !<textDigest>
    jsonPaths:
    - "$..body.content"
  transforms:
  - !<pseudonymize>
    jsonPaths:
    - "$..emailAddress.address"
    encoding: "URL_SAFE_TOKEN"
  - !<tokenize>
    jsonPaths:
    - "$.['@odata.nextLink', '@odata.prevLink', 'sessions@odata.nextLink']"
    regex: "^https://graph.microsoft.com/v1.0/users/([a-zA-Z0-9_-]+)/.*$"
  - !<redact>
    jsonPaths:
    - "$..body.content"
  - !<redact>
    jsonPaths:
    - "$..['@odata.context']"
  responseSchema:
    type: "object"
    properties:
      '@microsoft.graph.hasMoreData':
        type: "boolean"
      '@odata.context':
        type: "string"
      '@odata.deltaLink':
        type: "string"
      '@odata.nextLink':
        type: "string"
      value:
        type: "array"
        items:
          $ref: "#/definitions/Message"
- pathRegex: "^/v1.0/users(/p~[a-zA-Z0-9_-]+?)?[^/]*/mailboxSettings"
  transforms:
  - !<redact>
    jsonPaths:
    - "$..['@odata.context']"
  responseSchema:
    type: "object"
    properties:
      '@odata.context':
        type: "string"
      archiveFolder:
        type: "string"
      automaticRepliesSetting:
        $ref: "#/definitions/AutomaticRepliesSettings"
      dateFormat:
        type: "string"
      delegateMeetingMessageDeliveryOptions:
        type: "string"
      language:
        $ref: "#/definitions/LocaleInfo"
      timeFormat:
        type: "string"
      timeZone:
        type: "string"
      userPurpose:
        type: "string"
      workingHours:
        $ref: "#/definitions/WorkingHours"
- pathRegex: "^/v1.0/users(/p~[a-zA-Z0-9_-]+?)?[^/]*/messages/[^/]*"
  augments:
  - !<textDigest>
    jsonPaths:
    - "$..body.content"
  transforms:
  - !<pseudonymize>
    jsonPaths:
    - "$..emailAddress.address"
    encoding: "URL_SAFE_TOKEN"
  - !<tokenize>
    jsonPaths:
    - "$.['@odata.nextLink', '@odata.prevLink', 'sessions@odata.nextLink']"
    regex: "^https://graph.microsoft.com/v1.0/users/([a-zA-Z0-9_-]+)/.*$"
  - !<redact>
    jsonPaths:
    - "$..body.content"
  - !<redact>
    jsonPaths:
    - "$..['@odata.context']"
  responseSchema:
    type: "object"
    properties:
      '@odata.context':
        type: "string"
      '@odata.etag':
        type: "string"
      attachments:
        type: "array"
        items:
          $ref: "#/definitions/Attachment"
      bccRecipients:
        type: "array"
        items:
          $ref: "#/definitions/Recipient"
      body:
        $ref: "#/definitions/ItemBody"
      categories:
        type: "array"
        items:
          type: "string"
      ccRecipients:
        type: "array"
        items:
          $ref: "#/definitions/Recipient"
      changeKey:
        type: "string"
      conversationId:
        type: "string"
      conversationIndex:
        type: "string"
      createdDateTime:
        type: "string"
        format: "date-time"
      flag:
        $ref: "#/definitions/FlagStatus"
      from:
        $ref: "#/definitions/Recipient"
      hasAttachments:
        type: "boolean"
      id:
        type: "string"
      importance:
        type: "string"
      inferenceClassification:
        type: "string"
      internetMessageId:
        type: "string"
      isDeliveryReceiptRequested:
        type: "boolean"
      isDraft:
        type: "boolean"
      isRead:
        type: "boolean"
      isReadReceiptRequested:
        type: "boolean"
      lastModifiedDateTime:
        type: "string"
        format: "date-time"
      mentionsPreview:
        $ref: "#/definitions/MentionsPreview"
      parentFolderId:
        type: "string"
      receivedDateTime:
        type: "string"
        format: "date-time"
      replyTo:
        type: "array"
        items:
          $ref: "#/definitions/Recipient"
      sender:
        $ref: "#/definitions/Recipient"
      sentDateTime:
        type: "string"
        format: "date-time"
      toRecipients:
        type: "array"
        items:
          $ref: "#/definitions/Recipient"
      unsubscribeData:
        type: "array"
        items:
          type: "string"
      unsubscribeEnabled:
        type: "boolean"
      webLink:
        type: "string"
definitions:
  Attachment:
    type: "object"
    properties:
      size:
        type: "integer"
  AutomaticRepliesSettings:
    type: "object"
    properties:
      externalAudience:
        type: "string"
      scheduledEndDateTime:
        $ref: "#/definitions/DateTimeTimeZone"
      scheduledStartDateTime:
        $ref: "#/definitions/DateTimeTimeZone"
      status:
        type: "string"
  CustomTimeZone:
    type: "object"
    properties:
      '@odata.type':
        type: "string"
        constant: "#microsoft.graph.customTimeZone"
      bias:
        type: "integer"
      daylightOffset:
        $ref: "#/definitions/Offset"
      name:
        type: "string"
      standardOffset:
        $ref: "#/definitions/Offset"
  DateTimeTimeZone:
    type: "object"
    properties:
      dateTime:
        type: "string"
        format: "date-time"
      timeZone:
        type: "string"
      timeZoneIANA:
        type: "string"
  EmailAddress:
    type: "object"
    properties:
      address:
        type: "string"
  FlagStatus:
    type: "object"
    properties:
      completedDateTime:
        $ref: "#/definitions/DateTimeTimeZone"
      dueDateTime:
        $ref: "#/definitions/DateTimeTimeZone"
      flagStatus:
        type: "string"
      startDateTime:
        $ref: "#/definitions/DateTimeTimeZone"
  GraphUser:
    type: "object"
    properties:
      accountEnabled:
        type: "boolean"
      employeeId:
        type: "string"
      hireDate:
        type: "string"
        format: "date-time"
      id:
        type: "string"
      isResourceAccount:
        type: "boolean"
      mail:
        type: "string"
      mailboxSettings:
        $ref: "#/definitions/MailboxSettings"
      otherMails:
        type: "array"
        items:
          type: "string"
      proxyAddresses:
        type: "array"
        items:
          type: "string"
      userType:
        type: "string"
  ItemBody:
    type: "object"
    properties:
      content:
        type: "string"
      contentType:
        type: "string"
  LocaleInfo:
    type: "object"
    properties:
      displayName:
        type: "string"
      locale:
        type: "string"
  MailboxSettings:
    type: "object"
    properties:
      archiveFolder:
        type: "string"
      automaticRepliesSetting:
        $ref: "#/definitions/AutomaticRepliesSettings"
      dateFormat:
        type: "string"
      delegateMeetingMessageDeliveryOptions:
        type: "string"
      language:
        $ref: "#/definitions/LocaleInfo"
      timeFormat:
        type: "string"
      timeZone:
        type: "string"
      userPurpose:
        type: "string"
      workingHours:
        $ref: "#/definitions/WorkingHours"
  MentionsPreview:
    type: "object"
    properties:
      isMentioned:
        type: "boolean"
  Message:
    type: "object"
    properties:
      '@odata.context':
        type: "string"
      '@odata.etag':
        type: "string"
      attachments:
        type: "array"
        items:
          $ref: "#/definitions/Attachment"
      bccRecipients:
        type: "array"
        items:
          $ref: "#/definitions/Recipient"
      body:
        $ref: "#/definitions/ItemBody"
      categories:
        type: "array"
        items:
          type: "string"
      ccRecipients:
        type: "array"
        items:
          $ref: "#/definitions/Recipient"
      changeKey:
        type: "string"
      conversationId:
        type: "string"
      conversationIndex:
        type: "string"
      createdDateTime:
        type: "string"
        format: "date-time"
      flag:
        $ref: "#/definitions/FlagStatus"
      from:
        $ref: "#/definitions/Recipient"
      hasAttachments:
        type: "boolean"
      id:
        type: "string"
      importance:
        type: "string"
      inferenceClassification:
        type: "string"
      internetMessageId:
        type: "string"
      isDeliveryReceiptRequested:
        type: "boolean"
      isDraft:
        type: "boolean"
      isRead:
        type: "boolean"
      isReadReceiptRequested:
        type: "boolean"
      lastModifiedDateTime:
        type: "string"
        format: "date-time"
      mentionsPreview:
        $ref: "#/definitions/MentionsPreview"
      parentFolderId:
        type: "string"
      receivedDateTime:
        type: "string"
        format: "date-time"
      replyTo:
        type: "array"
        items:
          $ref: "#/definitions/Recipient"
      sender:
        $ref: "#/definitions/Recipient"
      sentDateTime:
        type: "string"
        format: "date-time"
      toRecipients:
        type: "array"
        items:
          $ref: "#/definitions/Recipient"
      unsubscribeData:
        type: "array"
        items:
          type: "string"
      unsubscribeEnabled:
        type: "boolean"
      webLink:
        type: "string"
  Offset:
    type: "object"
    properties:
      dayOccurrence:
        type: "integer"
      dayOfWeek:
        type: "string"
      daylightBias:
        type: "integer"
      month:
        type: "integer"
      time:
        type: "string"
      year:
        type: "integer"
  Recipient:
    type: "object"
    properties:
      emailAddress:
        $ref: "#/definitions/EmailAddress"
  WorkingHours:
    type: "object"
    properties:
      daysOfWeek:
        type: "array"
        items:
          type: "string"
      endTime:
        type: "string"
        format: "time"
      startTime:
        type: "string"
        format: "time"
      timeZone:
        anyOf:
        - $ref: "#/definitions/CustomTimeZone"
