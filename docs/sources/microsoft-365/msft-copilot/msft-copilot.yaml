          - "what are"
          - "how does"
          - "how do"
          - "how to"
          - "explain how"
          - "explain why"
          - "explain what"
          - "why does"
          - "why is"
          - "difference between"
          - "best practices"
          - "compared to"
          - "brainstorm"
          - "alternatives"
          - "versus"
          - "tradeoffs"
          - "explain"
          - "compared"
    transforms:
      - !<pseudonymize>
        jsonPaths:
          - "$..emailAddress"
        encoding: "URL_SAFE_TOKEN"
      - !<redact>
        jsonPaths:
          - "$..displayName"
          - "$..contentUrl"
          - "$..attachments[*].name"
          - "$..attachments[*].contentUrl"
          - "$..mentions[*].mentionText"
          - "$..contexts[*].contextReference"
          - "$..links[?(@.linkType == 'File')].linkUrl"
      - !<redact>
        jsonPaths:
          - "$..body.content"
          - "$..attachments[*].content"
      - !<redact>
        jsonPaths:
          - "$..['@odata.context']"
      - !<redact>
        jsonPaths:
          - "$..['@odata.count']"
      - !<redact>
        jsonPaths:
          - "$..['@odata.type']"
  - pathRegex: "^/v1.0/users/?[^/]*"
    allowedQueryParams:
      - "$top"
      - "$select"
      - "$skiptoken"
      - "$orderBy"
      - "$count"
      - "$filter"
    allowedRequestHeaders:
      - "ConsistencyLevel"
    transforms:
      - !<pseudonymizeRegexMatches>
        jsonPaths:
          - "$..proxyAddresses[*]"
        regex: "(?i)^smtp:(.*)$"
      - !<redact>
        jsonPaths:
          - "$..displayName"
          - "$..aboutMe"
          - "$..mySite"
          - "$..preferredName"
          - "$..givenName"
          - "$..surname"
          - "$..jobTitle"
          - "$..mailNickname"
          - "$..responsibilities"
          - "$..skills"
          - "$..faxNumber"
          - "$..mobilePhone"
          - "$..businessPhones[*]"
          - "$..onPremisesExtensionAttributes"
          - "$..onPremisesSecurityIdentifier"
          - "$..securityIdentifier"
      - !<pseudonymize>
        jsonPaths:
          - "$..employeeId"
          - "$..userPrincipalName"
          - "$..imAddresses[*]"
          - "$..mail"
          - "$..otherMails[*]"
          - "$..onPremisesSamAccountName"
          - "$..onPremisesUserPrincipalName"
          - "$..onPremisesDistinguishedName"
          - "$..onPremisesImmutableId"
          - "$..identities[*].issuerAssignedId"
        encoding: "URL_SAFE_TOKEN"
