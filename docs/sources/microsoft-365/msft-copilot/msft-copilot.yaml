- pathRegex: "^/v1.0/users/?(\\?.*)?$"
  allowedQueryParams:
  - "$top"
  - "$select"
  - "$skiptoken"
  - "$orderBy"
  - "$count"
  - "$filter"
  allowedRequestHeaders:
  - "ConsistencyLevel"
  transforms:
  - !<pseudonymize>
    jsonPaths:
    - "$..employeeId"
    - "$..userPrincipalName"
    - "$..imAddresses[*]"
    - "$..mail"
    - "$..otherMails[*]"
    - "$..onPremisesSamAccountName"
    - "$..onPremisesUserPrincipalName"
    - "$..onPremisesDistinguishedName"
    - "$..onPremisesImmutableId"
    - "$..identities[*].issuerAssignedId"
    encoding: "URL_SAFE_TOKEN"
  - !<pseudonymizeRegexMatches>
    jsonPaths:
    - "$..proxyAddresses[*]"
    regex: "(?i)^smtp:(.*)$"
  responseSchema:
    type: "object"
    properties:
      '@microsoft.graph.hasMoreData':
        type: "boolean"
      '@odata.deltaLink':
        type: "string"
      '@odata.nextLink':
        type: "string"
      value:
        type: "array"
        items:
          $ref: "#/definitions/GraphUser"
- pathRegex: "^/v1.0/users/[^/?]+(\\?.*)?$"
  allowedQueryParams:
  - "$select"
  allowedRequestHeaders:
  - "ConsistencyLevel"
  transforms:
  - !<pseudonymize>
    jsonPaths:
    - "$..employeeId"
    - "$..userPrincipalName"
    - "$..imAddresses[*]"
    - "$..mail"
    - "$..otherMails[*]"
    - "$..onPremisesSamAccountName"
    - "$..onPremisesUserPrincipalName"
    - "$..onPremisesDistinguishedName"
    - "$..onPremisesImmutableId"
    - "$..identities[*].issuerAssignedId"
    encoding: "URL_SAFE_TOKEN"
  - !<pseudonymizeRegexMatches>
    jsonPaths:
    - "$..proxyAddresses[*]"
    regex: "(?i)^smtp:(.*)$"
  responseSchema:
    type: "object"
    properties:
      accountEnabled:
        type: "boolean"
      employeeId:
        type: "string"
      hireDate:
        type: "string"
        format: "date-time"
      id:
        type: "string"
      isResourceAccount:
        type: "boolean"
      mail:
        type: "string"
      mailboxSettings:
        $ref: "#/definitions/MailboxSettings"
      otherMails:
        type: "array"
        items:
          type: "string"
      proxyAddresses:
        type: "array"
        items:
          type: "string"
      userType:
        type: "string"
definitions:
  AIInteraction:
    type: "object"
    properties:
      airesponse:
        type: "boolean"
      appClass:
        type: "string"
      attachments:
        type: "array"
        items:
          $ref: "#/definitions/AIInteractionAttachment"
      body:
        $ref: "#/definitions/ItemBody"
      contexts:
        type: "array"
        items:
          $ref: "#/definitions/AIInteractionContext"
      conversationType:
        type: "string"
      createdDateTime:
        type: "string"
        format: "date-time"
      etag:
        type: "string"
      from:
        $ref: "#/definitions/IdentitySet"
      id:
        type: "string"
      interactionType:
        type: "string"
      links:
        type: "array"
        items:
          $ref: "#/definitions/AIInteractionLink"
      locale:
        type: "string"
      mentions:
        type: "array"
        items:
          $ref: "#/definitions/AIInteractionMention"
      requestId:
        type: "string"
      sessionId:
        type: "string"
      userPrompt:
        type: "boolean"
  AIInteractionAttachment:
    type: "object"
    properties:
      attachmentId:
        type: "string"
      content:
        type: "string"
      contentType:
        type: "string"
  AIInteractionContext:
    type: "object"
    properties:
      contextType:
        type: "string"
  AIInteractionLink:
    type: "object"
    properties:
      linkType:
        type: "string"
      linkUrl:
        type: "string"
  AIInteractionMention:
    type: "object"
    properties:
      mentionId:
        type: "integer"
      mentioned:
        $ref: "#/definitions/AIInteractionMentionedIdentitySet"
  AIInteractionMentionedIdentitySet:
    type: "object"
    properties:
      conversation:
        $ref: "#/definitions/TeamWorkConversationIdentity"
      tag:
        $ref: "#/definitions/Identity"
  AutomaticRepliesSettings:
    type: "object"
    properties:
      externalAudience:
        type: "string"
      scheduledEndDateTime:
        $ref: "#/definitions/DateTimeTimeZone"
      scheduledStartDateTime:
        $ref: "#/definitions/DateTimeTimeZone"
      status:
        type: "string"
  CustomTimeZone:
    type: "object"
    properties:
      '@odata.type':
        type: "string"
      bias:
        type: "integer"
      daylightOffset:
        $ref: "#/definitions/Offset"
      name:
        type: "string"
      standardOffset:
        $ref: "#/definitions/Offset"
  DateTimeTimeZone:
    type: "object"
    properties:
      dateTime:
        type: "string"
        format: "date-time"
      timeZone:
        type: "string"
      timeZoneIANA:
        type: "string"
  GraphUser:
    type: "object"
    properties:
      accountEnabled:
        type: "boolean"
      employeeId:
        type: "string"
      hireDate:
        type: "string"
        format: "date-time"
      id:
        type: "string"
      isResourceAccount:
        type: "boolean"
      mail:
        type: "string"
      mailboxSettings:
        $ref: "#/definitions/MailboxSettings"
      otherMails:
        type: "array"
        items:
          type: "string"
      proxyAddresses:
        type: "array"
        items:
          type: "string"
      userType:
        type: "string"
  Identity:
    type: "object"
    properties:
      applicationIdentityType:
        type: "string"
      email:
        type: "string"
      id:
        type: "string"
      tenantId:
        type: "string"
      userIdentityType:
        type: "string"
  IdentitySet:
    type: "object"
    properties:
      application:
        $ref: "#/definitions/Identity"
      applicationInstance:
        $ref: "#/definitions/Identity"
      conversation:
        $ref: "#/definitions/Identity"
      conversationIdentityType:
        $ref: "#/definitions/Identity"
      device:
        $ref: "#/definitions/Identity"
      encrypted:
        $ref: "#/definitions/Identity"
      guest:
        $ref: "#/definitions/Identity"
      onPremises:
        $ref: "#/definitions/Identity"
      user:
        $ref: "#/definitions/Identity"
  ItemBody:
    type: "object"
    properties:
      content:
        type: "string"
      contentType:
        type: "string"
  LocaleInfo:
    type: "object"
    properties:
      displayName:
        type: "string"
      locale:
        type: "string"
  MailboxSettings:
    type: "object"
    properties:
      archiveFolder:
        type: "string"
      automaticRepliesSetting:
        $ref: "#/definitions/AutomaticRepliesSettings"
      dateFormat:
        type: "string"
      delegateMeetingMessageDeliveryOptions:
        type: "string"
      language:
        $ref: "#/definitions/LocaleInfo"
      timeFormat:
        type: "string"
      timeZone:
        type: "string"
      userPurpose:
        type: "string"
      workingHours:
        $ref: "#/definitions/WorkingHours"
  Offset:
    type: "object"
    properties:
      dayOccurrence:
        type: "integer"
      dayOfWeek:
        type: "string"
      daylightBias:
        type: "integer"
      month:
        type: "integer"
      time:
        type: "string"
      year:
        type: "integer"
  TeamWorkConversationIdentity:
    type: "object"
    properties:
      applicationIdentityType:
        type: "string"
      conversationIdentityType:
        type: "string"
      email:
        type: "string"
      id:
        type: "string"
      tenantId:
        type: "string"
      userIdentityType:
        type: "string"
  WorkingHours:
    type: "object"
    properties:
      daysOfWeek:
        type: "array"
        items:
          type: "string"
      endTime:
        type: "string"
        format: "time"
      startTime:
        type: "string"
        format: "time"
      timeZone:
        anyOf:
        - $ref: "#/definitions/CustomTimeZone"
