---
endpoints:
  - pathTemplate: "/beta/copilot/users/{id}/interactionHistory/getAllEnterpriseInteractions"
    allowedQueryParams:
      - "$filter"
    augments:
      - !<textDigest>
        jsonPaths:
          - "$..attachments[*].content"
        innerJsonPath: "$..text"
      - !<textDigest>
        jsonPaths:
          - "$..body.content"
        keywords:
          - "python"
          - "javascript"
          - "typescript"
          - "java"
          - "sql"
          - "html"
          - "react"
          - "bash"
          - "css"
          - "docker"
          - "ruby"
          - "golang"
          - "kotlin"
          - "php"
          - "node"
          - "angular"
          - "vue"
          - "swift"
          - "npm"
          - "github"
          - "git"
          - "function"
          - "error"
          - "api"
          - "debug"
          - "implement"
          - "bug"
          - "deploy"
          - "script"
          - "class"
          - "method"
          - "array"
          - "exception"
          - "refactor"
          - "compile"
          - "callback"
          - "const"
          - "async"
          - "await"
          - "pull request"
          - "code review"
          - "unit test"
          - "stack trace"
          - "code"
          - "generate image"
          - "create image"
          - "draw image"
          - "make image"
          - "design image"
          - "picture of"
          - "illustration of"
          - "visual of"
          - "render"
          - "generate graphic"
          - "create graphic"
          - "dall-e"
          - "dalle"
          - "email"
          - "e-mail"
          - "mail"
          - "summarize"
          - "summarise"
          - "summary"
          - "pivot table"
          - "bar chart"
          - "line chart"
          - "pie chart"
          - "data analysis"
          - "vlookup"
          - "financials"
          - "accounting"
          - "payroll"
          - "breakeven"
          - "cashflow"
          - "nps"
          - "tableau"
          - "snowflake"
          - "analyze"
          - "chart"
          - "pivot"
          - "write"
          - "draft"
          - "compose"
          - "craft"
          - "design"
          - "draw"
          - "rewrite"
          - "proofread"
          - "redline"
          - "review"
          - "translate to"
          - "report"
          - "proposal"
          - "blog"
          - "article"
          - "presentation"
          - "slides"
          - "brief"
